<section class="user-page">
  <h1 class="user-page__title">Список Пользователей</h1>
  <app-user-create (createUser)="onCreateUser($event)"></app-user-create>
  <app-users-filter (filterUsers)="onFilterUsers($event)"></app-users-filter>

  @if (filteredUsers$ | async; as users) {
    <p class="user-page__count">
      {{ users.length }}
      {{ users.length | plural: 'пользователь' : 'пользователя' : 'пользователей' }}
    </p>
    @if (users.length > 0) {
      <div class="user-page__list">
        @for (user of users; track user.id) {
          <app-user-card [user]="user" (deleteUser)="onDeleteUser($event)"></app-user-card>
        }
      </div>
    } @else {
      <p class="user-page__empty">Нет пользователей для отображения</p>
    }
  }
</section>
