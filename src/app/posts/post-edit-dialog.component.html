<form class="post-edit-form" (ngSubmit)="save()">
  <label for="title">Название</label>

  <input
    id="title"
    name="title"
    type="text"
    pInputText
    [(ngModel)]="title"
    required
  />

  <label for="tags">Теги</label>

  <input id="tags" name="tags" type="text" pInputText [(ngModel)]="tags" />

  <label for="views">Просмотры</label>

  <input id="views" name="views" type="number" pInputText [(ngModel)]="views" />

  <div class="dialog-actions">
    <button type="button" (click)="cancel()" [disabled]="isSaving">
      Отмена
    </button>

    <button type="submit" [disabled]="isSaving || !title.trim()">
      {{ isSaving ? 'Сохранение...' : 'Сохранить' }}
    </button>
  </div>
</form>
