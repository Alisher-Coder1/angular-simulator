<header class="header">
  <span class="header__company-name">{{ appConfig.companyName }}</span>
  <nav class="header__navigation">
    @for (link of navigationLinks; track link.path) {
      <a
        class="header__link"
        [routerLink]="link.path"
        routerLinkActive="header__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        {{ link.title }}
      </a>
    }
  </nav>
  <div class="header__auth">
    @if (currentUser$ | async; as user) {
      <span class="header__user">
        {{ user.firstName }} {{ user.lastName }}
      </span>

      <button type="button" class="header__logout" (click)="logout()">
        Выйти
      </button>
    } @else {
      <a class="header__link" routerLink="/login"> Войти </a>
    }
  </div>
  @if (appConfig.enableTheming) {
    <div class="header__settings">
      <div class="header__mode">
        <label for="dark-mode">
          {{ isDarkMode ? 'Тёмный режим' : 'Светлый режим' }}
        </label>

        <p-toggleswitch
          inputId="dark-mode"
          [ngModel]="isDarkMode"
          (ngModelChange)="changeColorMode($event)"
        ></p-toggleswitch>
      </div>
      <div class="header__theme">
        <span id="theme-label">Тема:</span>
        <p-selectbutton
          [options]="themeOptions"
          [ngModel]="currentTheme"
          (ngModelChange)="changeTheme($event)"
          optionLabel="label"
          optionValue="value"
          [allowEmpty]="false"
          aria-labelledby="theme-label"
        ></p-selectbutton>
      </div>
    </div>
  }
</header>
