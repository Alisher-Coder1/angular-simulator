<ng-template #messageTemplate let-message>
  <div class="message" [class]="'message message--' + message.type">
    <img class="message__icon" src="assets/message.svg" alt="" />

    <div class="message__content">
      <strong class="message__title">
        {{ message.type }}
      </strong>

      <p class="message__text">
        {{ message.text }}
      </p>
    </div>

    <button class="message__close" type="button" (click)="closeMessage(message.id)">×</button>
  </div>
</ng-template>

<div class="messages">
  <ng-container
    *ngFor="let message of messages$ | async"
    [ngTemplateOutlet]="messageTemplate"
    [ngTemplateOutletContext]="{ $implicit: message }"
  >
  </ng-container>
</div>
