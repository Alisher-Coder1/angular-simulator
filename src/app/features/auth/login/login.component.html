<section class="login-page">
  <form class="login-form" [formGroup]="loginForm" (ngSubmit)="login()">
    <h1>Вход</h1>

    <div class="form-field">
      <label for="username">Логин</label>

      <input
        id="username"
        type="text"
        formControlName="username"
        autocomplete="username"
        placeholder="Введите логин"
      />

      @if (
        loginForm.controls.username.touched &&
        loginForm.controls.username.invalid
      ) {
        <small class="field-error">Введите логин</small>
      }
    </div>

    <div class="form-field">
      <label for="password">Пароль</label>

      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        placeholder="Введите пароль"
      />

      @if (
        loginForm.controls.password.touched &&
        loginForm.controls.password.invalid
      ) {
        <small class="field-error">Введите пароль</small>
      }
    </div>

    @if (errorMessage) {
      <p class="login-error">{{ errorMessage }}</p>
    }

    <button type="submit" [disabled]="loginForm.invalid || isLoading">
      {{ isLoading ? 'Вход...' : 'Войти' }}
    </button>
  </form>
</section>
