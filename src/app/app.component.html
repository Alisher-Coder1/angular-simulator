<section class="hero">
  <header class="header">
    <div class="header__inner">
      <a class="logo" href="#">
        <img class="logo__icon" src="assets/logo-mountains.svg" alt="" />

        <span class="logo__text">
          {{ companyName }}
        </span>
      </a>

      <nav class="nav">
        @for (item of menuItems; track item) {
          <a class="nav__link" href="#">
            {{ item }}
          </a>
        }
      </nav>

      <button class="consultation-button" type="button">Консультация</button>
    </div>
  </header>

  <div class="hero__content">
    <h1 class="hero__title">
      НАСЛАДИСЬ ПРОГУЛКОЙ В ГОРАХ <br />
      С КОМАНДОЙ ЕДИНОМЫШЛЕННИКОВ
    </h1>
    <form class="search-form">
      <div class="search-field">
        <div class="search-field__top">
          <span>Локация для тура</span>
          <span class="search-field__icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path
                d="M4.5 6.75L9 11.25L13.5 6.75"
                stroke="#FDFDFD"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </div>
        <span class="search-field__hint">выберите из списка</span>
      </div>

      <div class="search-field">
        <div class="search-field__top">
          <span>Дата похода</span>
          <span class="search-field__icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path
                d="M5.25 2.25V4.5M12.75 2.25V4.5M3 6.75H15M4.5 3.75H13.5C14.3284 3.75 15 4.42157 15 5.25V14.25C15 15.0784 14.3284 15.75 13.5 15.75H4.5C3.67157 15.75 3 15.0784 3 14.25V5.25C3 4.42157 3.67157 3.75 4.5 3.75Z"
                stroke="#FDFDFD"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </div>
        <span class="search-field__hint">укажите дату</span>
      </div>

      <div class="search-field">
        <div class="search-field__top">
          <span>Участники</span>
          <span class="search-field__icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path
                d="M4.5 6.75L9 11.25L13.5 6.75"
                stroke="#FDFDFD"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </div>
        <span class="search-field__hint">выберите из списка</span>
      </div>

      <button class="search-button" type="button">Найти программу</button>
    </form>
  </div>
</section>
